<!DOCTYPE html>
<html lang="ca">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Disseny i Producte 1 - Test de Preparació</title>
  <style>
    :root {
      --bg: #0d1117;
      --card-bg: #161b22;
      --border: #30363d;
      --text: #c9d1d9;
      --text-muted: #8b949e;
      --accent: #58a6ff;
      --accent-hover: #1f6feb;
      --correct: #238636;
      --incorrect: #da3633;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      min-height: 100vh;
      padding: 20px 15px;
    }

    .container {
      width: 100%;
      max-width: 680px;
      margin: 0 auto;
    }

    header {
      margin-bottom: 24px;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--border);
      text-align: center;
    }

    .subtitle {
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      color: var(--accent);
      margin-bottom: 4px;
      font-weight: 600;
    }

    h1 {
      font-size: 1.6rem;
      font-weight: 600;
      color: #f0f6fc;
    }

    .card {
      background-color: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 20px;
      margin-bottom: 20px;
    }

    .mode-selection p {
      color: var(--text-muted);
      font-size: 0.95rem;
      margin-bottom: 16px;
      text-align: center;
    }

    .btn-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(110px, 1fr));
      gap: 10px;
      margin-bottom: 12px;
    }

    .btn {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text);
      padding: 12px;
      border-radius: 6px;
      font-size: 0.95rem;
      cursor: pointer;
      transition: all 0.2s ease;
      font-weight: 500;
      width: 100%;
      text-align: center;
    }

    .btn:hover {
      background-color: rgba(88, 166, 255, 0.1);
      border-color: var(--accent);
      color: var(--accent);
    }

    .btn-full {
      grid-column: 1 / -1;
      background-color: var(--accent);
      color: #ffffff;
      border-color: var(--accent);
    }

    .btn-full:hover {
      background-color: var(--accent-hover);
      color: #ffffff;
    }

    .dashboard {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 8px;
      margin-bottom: 20px;
      text-align: center;
    }

    .metric-box {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 10px 4px;
    }

    .metric-label {
      font-size: 0.7rem;
      color: var(--text-muted);
      text-transform: uppercase;
      margin-bottom: 4px;
    }

    .metric-value {
      font-size: 1.1rem;
      font-weight: 600;
      color: #f0f6fc;
    }

    .progress-bar {
      height: 4px;
      background: var(--border);
      border-radius: 2px;
      margin-bottom: 16px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      background: var(--accent);
      width: 0%;
      transition: width 0.3s ease;
    }

    .question-header {
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-bottom: 8px;
    }

    .question-title {
      font-size: 1.1rem;
      font-weight: 500;
      line-height: 1.4;
      margin-bottom: 20px;
      color: #f0f6fc;
    }

    .options-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .option-btn {
      text-align: left;
      line-height: 1.4;
    }

    .option-btn.correct {
      background-color: rgba(35, 134, 54, 0.2) !important;
      border-color: var(--correct) !important;
      color: #56d364 !important;
    }

    .option-btn.incorrect {
      background-color: rgba(218, 54, 51, 0.2) !important;
      border-color: var(--incorrect) !important;
      color: #f85149 !important;
    }

    .results-card {
      text-align: center;
    }

    .results-card h2 {
      margin-bottom: 12px;
    }

    .score-display {
      font-size: 2.5rem;
      font-weight: 700;
      color: var(--accent);
      margin: 16px 0;
    }

    .hidden {
      display: none !important;
    }

    @media (max-width: 480px) {
      .dashboard {
        grid-template-columns: repeat(3, 1fr);
      }
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <div class="subtitle">Disseny i Producte 1</div>
      <h1>Qüestionari de preparació</h1>
    </header>

    <div id="start-screen" class="card mode-selection">
      <p>Selecciona el nombre de preguntes per començar el test.</p>
      <div class="btn-grid">
        <button class="btn" onclick="iniciarTest(10)">10 Preguntes
